<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login – Life Hub</title><link rel="stylesheet" href="style.css"></head><body>
<div class="center"><div class="card login"><div class="av"></div><h1>Log In</h1><p class="sub">Welcome back to Life Hub</p>
<div class="f"><label for="e">Email</label><input class="in" id="e" type="email" placeholder="you@example.com"></div>
<div class="f"><label for="p">Password</label><input class="in" id="p" type="password" placeholder="••••••••"></div>
<div class="err" id="er"></div><button class="btn" id="b" style="width:100%">Log In</button>
<p><a href="#" id="fp" style="color:var(--ac);font-size:.85rem;text-decoration:none">Forgot password?</a></p></div></div>
<div id="toast"></div><script src="app.js"></script>
<script>
const ok=v=>/^\S+@\S+\.\S+$/.test(v);$('#e').value=S.email;
function go(){const e=$('#e').value.trim(),p=$('#p').value;
if(!ok(e))return $('#er').textContent='Enter a valid email address.';
if(S.pw&&p!==S.pw)return $('#er').textContent='Incorrect password.';
if(p.length<6)return $('#er').textContent='Password must be at least 6 characters.';
S.email=e;S.pw=p;save();location.href='dashboard.html'}
$('#b').onclick=go;document.onkeydown=e=>e.key==='Enter'&&go();
$('#fp').onclick=e=>{e.preventDefault();const v=$('#e').value.trim();if(ok(v)){$('#er').textContent='';toast('Reset link sent to '+v)}else $('#er').textContent='Enter your email first.'};
</script></body></html>
